name: Update whale maid calendar

on:
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/generate_whale.py'
      - 'assets/whale-maid-sprites.json'
      - '.github/workflows/whale-maid.yml'

permissions:
  contents: write

concurrency:
  group: whale-maid-calendar
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate from real contributions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_whale.py
      - name: Publish calendar
        run: |
          git add assets/whale-maid.svg
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: update whale maid contribution calendar'
          git pull --rebase origin main
          git push
